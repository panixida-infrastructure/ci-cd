name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Validate action metadata
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d # v0.9.0
        with:
          version: 0.9.0
          patterns: |
            :(glob).github/actions/*/action.yml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 4.3.0

      - name: Lint application chart
        run: |
          helm lint charts/application \
            --strict \
            --set image.repository=ghcr.io/example/api \
            --set image.tag=1

      - name: Render application chart
        run: |
          helm template example charts/application \
            --set image.repository=ghcr.io/example/api \
            --set image.tag=1 \
            > /dev/null

  sonar-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test shared Sonar cache packaging and restoration
        run: python3 -m unittest discover -s tests -v

      - name: Setup .NET for cache smoke test
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Java for cache smoke test
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve SonarQube image
        id: versions
        run: python3 .github/actions/sonar-cache/cache.py info

      - name: Build real component archive
        run: bash .github/actions/sonar-cache/build.sh "$RUNNER_TEMP/sonar-archive"

      - name: Start disposable SonarQube
        env:
          SONAR_IMAGE: ${{ steps.versions.outputs.server-image }}
        run: |
          docker run -d --name sonar-cache-smoke -p 127.0.0.1:19000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true "$SONAR_IMAGE"

      - name: Analyze .NET and JSON with component downloads forbidden
        run: |
          python3 tests/sonar_cache_smoke.py \
            --server-url http://127.0.0.1:19000 --archive "$RUNNER_TEMP/sonar-archive"

      - name: Remove disposable SonarQube
        if: always()
        run: docker rm -fv sonar-cache-smoke || true

  notify:
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' }}
    needs: [ actionlint, helm, sonar-cache ]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
    with:
      event-name: ${{ github.event_name }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
