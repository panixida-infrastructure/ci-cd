name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Validate action metadata
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d # v0.9.0
        with:
          version: 0.9.0
          patterns: |
            :(glob).github/actions/*/action.yml

  gitlab-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install template test dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Validate GitLab templates and regression scenarios
        run: python3 -m unittest discover -s tests -p test_gitlab_templates.py -v

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 4.3.0

      - name: Lint application chart
        run: |
          helm lint charts/application \
            --strict \
            --set image.repository=ghcr.io/example/api \
            --set image.tag=1

      - name: Render application chart
        run: |
          helm template example charts/application \
            --set image.repository=ghcr.io/example/api \
            --set image.tag=1 \
            > /dev/null

  notify:
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' }}
    needs: [ actionlint, gitlab-templates, helm ]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
    with:
      event-name: ${{ github.event_name }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
