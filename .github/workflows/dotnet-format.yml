on:
  workflow_call:
    inputs:
      build-before-format:
        description: Build the solution so formatting can load project source generators and analyzers.
        type: boolean
        required: false
        default: false
    secrets:
      registry-user:
        required: true
      registry-token:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Create nuget.config
        if: ${{ vars.NUGET_CONFIG != '' }}
        env:
          NUGET_CONFIG: ${{ vars.NUGET_CONFIG }}
          NUGET_PROVIDER: ${{ vars.NUGET_PROVIDER }}
          REGISTRY_USER: ${{ secrets.registry-user }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
        run: |
          echo "$NUGET_CONFIG" | envsubst > ${{ vars.PROJECT_FOLDER }}/nuget.config

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-

      - name: Restore .NET solution
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: |
          dotnet restore

      - name: Build .NET solution for formatting
        if: ${{ inputs.build-before-format }}
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: dotnet build --no-restore

      - name: Run .NET format
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: |
          dotnet format --verify-no-changes --severity warn --no-restore
