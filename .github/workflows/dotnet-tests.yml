on:
  workflow_call:
    secrets:
      registry-user:
        required: true
      registry-token:
        required: true

env:
  REPORT_DIRECTORY: tests-report
  COVERAGE_DIRECTORY: tests-report/coverage

jobs:
  discover:
    name: Discover test projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      test-project-count: ${{ steps.discover.outputs.test-project-count }}
      coverage-project-count: ${{ steps.discover.outputs.coverage-project-count }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover test projects
        id: discover
        working-directory: ${{ vars.PROJECT_FOLDER }}
        env:
          COVERAGE_EXCLUDED_TEST_PROJECTS: ${{ vars.COVERAGE_EXCLUDED_TEST_PROJECTS }}
        run: |
          set -euo pipefail

          mapfile -t TEST_PROJECTS < <(find . -name '*Tests.csproj' | sort)

          COVERAGE_EXCLUDED_PATTERNS=()
          if [[ -n "$COVERAGE_EXCLUDED_TEST_PROJECTS" ]]; then
            read -r -a COVERAGE_EXCLUDED_PATTERNS <<< "$COVERAGE_EXCLUDED_TEST_PROJECTS"
          fi

          mapfile -d '' -t COVERAGE_EXCLUDED_PROJECTS < <(
            for PATTERN in "${COVERAGE_EXCLUDED_PATTERNS[@]}"; do
              find . -type f -name '*Tests.csproj' -path "$PATTERN" -print0
            done | sort -zu
          )

          if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
            echo "::error::No test projects matching *Tests.csproj were found"
            exit 1
          fi

          TEST_MATRIX='[]'
          COVERAGE_PROJECT_COUNT=0

          for TEST_PROJECT in "${TEST_PROJECTS[@]}"; do
            TEST_PROJECT_NAME="$(basename "$TEST_PROJECT" .csproj)"
            TEST_PROJECT_ID="$(printf '%s' "$TEST_PROJECT" | sha256sum | cut -c1-12)"
            COLLECT_COVERAGE=true

            for EXCLUDED_PROJECT in "${COVERAGE_EXCLUDED_PROJECTS[@]}"; do
              if [[ "$TEST_PROJECT" == "$EXCLUDED_PROJECT" ]]; then
                COLLECT_COVERAGE=false
                break
              fi
            done

            if [ "$COLLECT_COVERAGE" = "true" ]; then
              COVERAGE_PROJECT_COUNT=$((COVERAGE_PROJECT_COUNT + 1))
            fi

            TEST_MATRIX="$(
              jq -c \
                --arg project "$TEST_PROJECT" \
                --arg name "$TEST_PROJECT_NAME" \
                --arg id "$TEST_PROJECT_ID" \
                --argjson collectCoverage "$COLLECT_COVERAGE" \
                '. + [{
                  project: $project,
                  name: $name,
                  id: $id,
                  collectCoverage: $collectCoverage
                }]' <<< "$TEST_MATRIX"
            )"
          done

          {
            echo "matrix=$(jq -c '{include: .}' <<< "$TEST_MATRIX")"
            echo "test-project-count=${#TEST_PROJECTS[@]}"
            echo "coverage-project-count=$COVERAGE_PROJECT_COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Discovered ${#TEST_PROJECTS[@]} test project(s)." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test ${{ matrix.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      TEST_PROJECT: ${{ matrix.project }}
      TEST_PROJECT_REPORT_DIRECTORY: tests-report/${{ matrix.id }}
      COLLECT_COVERAGE: ${{ matrix.collectCoverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Create nuget.config
        if: ${{ vars.NUGET_CONFIG != '' }}
        env:
          NUGET_CONFIG: ${{ vars.NUGET_CONFIG }}
          NUGET_PROVIDER: ${{ vars.NUGET_PROVIDER }}
          REGISTRY_USER: ${{ secrets.registry-user }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
        run: |
          echo "$NUGET_CONFIG" | envsubst > "${{ vars.PROJECT_FOLDER }}/nuget.config"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET solution
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: dotnet restore

      - name: Prepare test reports
        if: ${{ always() }}
        id: reports
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: |
          mkdir -p "$TEST_PROJECT_REPORT_DIRECTORY"
          echo "artifact_path=$(realpath "$REPORT_DIRECTORY")" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: |
          set -euo pipefail

          TEST_ARGS=(
            --project "$TEST_PROJECT"
            --no-restore
            --results-directory "$TEST_PROJECT_REPORT_DIRECTORY"
            --report-trx
            --report-trx-filename test_results.trx
          )

          if [ "$COLLECT_COVERAGE" = "true" ]; then
            TEST_ARGS+=(
              --coverage
              --coverage-output-format cobertura
              --coverage-output coverage.cobertura.xml
            )
          fi

          dotnet test "${TEST_ARGS[@]}"

      - name: Verify test reports
        if: ${{ always() }}
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: |
          set -euo pipefail

          if [ ! -f "$TEST_PROJECT_REPORT_DIRECTORY/test_results.trx" ]; then
            echo "::error::TRX report was not produced for $TEST_PROJECT"
            exit 1
          fi

          if [ "$COLLECT_COVERAGE" = "true" ] && \
             [ ! -f "$TEST_PROJECT_REPORT_DIRECTORY/coverage.cobertura.xml" ]; then
            echo "::error::Cobertura report was not produced for $TEST_PROJECT"
            exit 1
          fi

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.id }}
          path: ${{ steps.reports.outputs.artifact_path }}
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1

  run:
    if: ${{ always() }}
    needs:
      - discover
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Download test reports
        if: ${{ needs.test.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: ${{ env.REPORT_DIRECTORY }}
          merge-multiple: true

      - name: Verify aggregated reports
        if: ${{ needs.test.result != 'skipped' }}
        env:
          EXPECTED_TEST_PROJECT_COUNT: ${{ needs.discover.outputs.test-project-count }}
          EXPECTED_COVERAGE_PROJECT_COUNT: ${{ needs.discover.outputs.coverage-project-count }}
        run: |
          set -euo pipefail

          # Microsoft.Testing.Platform also copies coverage into nested TRX attachment directories.
          ACTUAL_TEST_PROJECT_COUNT="$(find "$REPORT_DIRECTORY" -mindepth 2 -maxdepth 2 -type f -name 'test_results.trx' | wc -l)"
          ACTUAL_COVERAGE_PROJECT_COUNT="$(find "$REPORT_DIRECTORY" -mindepth 2 -maxdepth 2 -type f -name 'coverage.cobertura.xml' | wc -l)"

          if [ "$ACTUAL_TEST_PROJECT_COUNT" -ne "$EXPECTED_TEST_PROJECT_COUNT" ]; then
            echo "::error::Expected $EXPECTED_TEST_PROJECT_COUNT TRX reports, found $ACTUAL_TEST_PROJECT_COUNT"
            exit 1
          fi

          if [ "$ACTUAL_COVERAGE_PROJECT_COUNT" -ne "$EXPECTED_COVERAGE_PROJECT_COUNT" ]; then
            echo "::error::Expected $EXPECTED_COVERAGE_PROJECT_COUNT coverage reports, found $ACTUAL_COVERAGE_PROJECT_COUNT"
            exit 1
          fi

      - name: Publish test results
        if: ${{ always() && hashFiles('tests-report/*/test_results.trx') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests
          path: tests-report/*/test_results.trx
          reporter: dotnet-trx
          fail-on-error: "false"

      - name: Install reportgenerator
        if: ${{ always() && hashFiles('tests-report/*/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate coverage summary
        if: ${{ always() && hashFiles('tests-report/*/coverage.cobertura.xml') != '' }}
        run: |
          reportgenerator \
            -reports:"${{ env.REPORT_DIRECTORY }}/*/coverage.cobertura.xml" \
            -targetdir:"$COVERAGE_DIRECTORY" \
            -reporttypes:"MarkdownSummary;TextSummary;SonarQube" \
            -assemblyfilters:"${{ vars.COVERAGE_ASSEMBLY_FILTERS }}" \
            -filefilters:"-*/obj/*;-*/Migrations/*"

      - name: Upload SonarQube coverage report
        if: ${{ always() && hashFiles('tests-report/coverage/SonarQube.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coverage-sonarqube
          path: tests-report/coverage/SonarQube.xml
          if-no-files-found: error
          retention-days: 1

      - name: Add coverage to job summary
        if: ${{ always() && hashFiles('tests-report/coverage/Summary.md') != '' }}
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          cat "$COVERAGE_DIRECTORY/Summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert coverage threshold
        if: ${{ always() && hashFiles('tests-report/coverage/Summary.txt') != '' }}
        run: |
          LINE_COVERAGE=$(grep -Po 'Line coverage[:\s]+\K[\d.]+' "$COVERAGE_DIRECTORY/Summary.txt" | head -1 || echo 0)
          BRANCH_COVERAGE=$(grep -Po 'Branch coverage[:\s]+\K[\d.]+' "$COVERAGE_DIRECTORY/Summary.txt" | head -1 || echo 0)
          echo "Line coverage: ${LINE_COVERAGE}% (threshold: ${{ vars.COVERAGE_THRESHOLD }}%)"
          echo "Branch coverage: ${BRANCH_COVERAGE}% (threshold: ${{ vars.COVERAGE_THRESHOLD }}%)"
          awk -v c="$LINE_COVERAGE" -v t="${{ vars.COVERAGE_THRESHOLD }}" 'BEGIN{exit (c+0<t+0)}' \
            || { echo "Line coverage ${LINE_COVERAGE}% is below threshold ${{ vars.COVERAGE_THRESHOLD }}%"; exit 1; }
          awk -v c="$BRANCH_COVERAGE" -v t="${{ vars.COVERAGE_THRESHOLD }}" 'BEGIN{exit (c+0<t+0)}' \
            || { echo "Branch coverage ${BRANCH_COVERAGE}% is below threshold ${{ vars.COVERAGE_THRESHOLD }}%"; exit 1; }

      - name: Propagate test failures
        if: ${{ always() && needs.test.result != 'success' }}
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "One or more test projects did not complete successfully: $TEST_RESULT"
          exit 1
