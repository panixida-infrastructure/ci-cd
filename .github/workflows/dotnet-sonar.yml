on:
  workflow_call:
    inputs:
      project-key:
        required: true
        type: string
      exclusions:
        required: false
        type: string
        default: >-
          **/bin/**,**/obj/**,**/Migrations/**,**/wwwroot/**,**/nuget.config
      coverage-artifact:
        required: false
        type: string
        default: dotnet-coverage-sonarqube
      project-version-file:
        description: Repository-relative JSON file containing the stable version field (for Previous version)
        required: false
        type: string
        default: ''

    secrets:
      sonar-token:
        required: true
      registry-user:
        required: true
      registry-token:
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch pull request target
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ./${{ vars.PROJECT_FOLDER }}/tests-report/sonar

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Setup Java for SonarQube
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Create nuget.config
        if: ${{ vars.NUGET_CONFIG != '' }}
        env:
          NUGET_CONFIG: ${{ vars.NUGET_CONFIG }}
          NUGET_PROVIDER: ${{ vars.NUGET_PROVIDER }}
          REGISTRY_USER: ${{ secrets.registry-user }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
        run: |
          echo "$NUGET_CONFIG" | envsubst > "${{ vars.PROJECT_FOLDER }}/nuget.config"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve SonarQube server version
        id: sonar-server
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$SONAR_HOST_URL" ]]; then
            echo "::error::SONAR_HOST_URL variable is required"
            exit 1
          fi

          server_version="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "${SONAR_HOST_URL%/}/api/server/version"
          )"

          if [[ ! "$server_version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::SonarQube returned an invalid server version"
            exit 1
          fi

          echo "version=$server_version" >> "$GITHUB_OUTPUT"

      - name: Restore shared SonarQube components and install scanner
        uses: PANiXiDA-Infrastructure/ci-cd/.github/actions/sonar-cache@main
        with:
          server-version: ${{ steps.sonar-server.outputs.version }}

      - name: Restore .NET solution
        working-directory: ${{ vars.PROJECT_FOLDER }}
        run: |
          dotnet restore

      - name: Build and analyze
        working-directory: ${{ vars.PROJECT_FOLDER }}
        env:
          SONAR_COVERAGE_REPORT: tests-report/sonar/SonarQube.xml
          SONAR_EXCLUSIONS: ${{ inputs.exclusions }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ inputs.project-key }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          SONAR_VERSION_FILE: ${{ inputs.project-version-file }}
          SONAR_EVENT_NAME: ${{ github.event_name }}
          SONAR_REF_TYPE: ${{ github.ref_type }}
          SONAR_BRANCH: ${{ github.ref_name }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
          SONAR_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$SONAR_HOST_URL" ]]; then
            echo "::error::SONAR_HOST_URL variable is required"
            exit 1
          fi

          if [[ -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::project-key input is required"
            exit 1
          fi

          if [[ ! -f "$SONAR_COVERAGE_REPORT" ]]; then
            echo "::error::SonarQube coverage report was not downloaded"
            exit 1
          fi

          SONAR_ARGS=(
            "/k:$SONAR_PROJECT_KEY"
            "/d:sonar.token=$SONAR_TOKEN"
            "/d:sonar.host.url=$SONAR_HOST_URL"
            "/d:sonar.scanner.skipJreProvisioning=true"
            "/d:sonar.http.timeout=900"
            "/d:sonar.plugin.cache.directory=$HOME/.sonar/resources"
            "/d:sonar.coverageReportPaths=$SONAR_COVERAGE_REPORT"
            "/d:sonar.qualitygate.wait=true"
            "/d:sonar.qualitygate.timeout=1800"
          )

          if [[ -n "$SONAR_EXCLUSIONS" ]]; then
            SONAR_ARGS+=("/d:sonar.exclusions=$SONAR_EXCLUSIONS")
          fi

          SONAR_ARGS+=("/d:sonar.scm.revision=$SONAR_REVISION")
          if [[ "$SONAR_EVENT_NAME" == "pull_request" ]]; then
            SONAR_ARGS+=(
              "/d:sonar.pullrequest.key=$SONAR_PR_KEY"
              "/d:sonar.pullrequest.branch=$SONAR_PR_BRANCH"
              "/d:sonar.pullrequest.base=$SONAR_PR_BASE"
            )
          elif [[ "$SONAR_REF_TYPE" == "branch" ]]; then
            SONAR_ARGS+=("/d:sonar.branch.name=$SONAR_BRANCH")
          else
            echo "::error::SonarQube analysis requires a branch or pull request event"
            exit 1
          fi

          if [[ -n "$SONAR_VERSION_FILE" ]]; then
            project_version="$(python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          relative = pathlib.Path(os.environ['SONAR_VERSION_FILE'])
          path = (root / relative).resolve()
          if relative.is_absolute() or not path.is_relative_to(root):
              raise SystemExit('::error::project-version-file must stay within the repository')
          try:
              version = json.loads(path.read_text(encoding='utf-8-sig')).get('version')
          except (OSError, ValueError, AttributeError) as error:
              raise SystemExit(f'::error::Cannot read project-version-file: {error}')
          if not isinstance(version, str) or not version.strip() or any(c in version for c in '\r\n'):
              raise SystemExit('::error::project-version-file requires a nonempty string version field')
          print(version.strip())
          PY
            )"
            SONAR_ARGS+=("/v:$project_version")
          fi

          dotnet sonarscanner begin "${SONAR_ARGS[@]}"
          dotnet build --configuration Release --no-restore
          dotnet sonarscanner end "/d:sonar.token=$SONAR_TOKEN"
